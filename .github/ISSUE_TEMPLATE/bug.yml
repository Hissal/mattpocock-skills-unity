name: Bug
description: A skill did the wrong thing in a real session.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Report failures in Unity skills and Unity deltas here. General skill work follows upstream's evidence bar and contribution process. A real upstream defect may receive a small temporary fix here; check upstream for an existing Issue, consider filing one if absent, and remove the fix when upstream resolves it. This includes defects in frozen `misc/` skills, without reopening general feature development.

        Read the [fork scope](https://github.com/Hissal/mattpocock-skills-unity/blob/main/SCOPE.md). Installer problems with `npx skills` belong at skills.sh.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill, e.g. `to-tickets`, `grilling`.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: e.g. Claude Code 2.3.1, Codex CLI 0.40, Cursor. Say how you installed (plugin or skills.sh) and which skills version.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and effort
      description: e.g. Opus, high effort. Roughly how full was the context when it happened?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what the skill did. Paste the relevant part of the session.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the skill should have done instead, and which line of the SKILL.md (if any) says so.
    validations:
      required: true
