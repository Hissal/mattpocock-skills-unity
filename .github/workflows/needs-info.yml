name: Close needs-info

# Closes open issues labelled `needs-info` after 14 days of inactivity.
# Touches only issues with that label. Never marks anything stale on its own.
# Qualifying updates requeue on the next run, without judging reply content.
# Add `needs-info` after asking. Closed issues require manual reopening.
# See docs/agents/triage-labels.md for maintainer handling.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write # the action keeps its state in the Actions cache
    steps:
      - uses: actions/stale@v10
        with:
          only-issue-labels: needs-info
          stale-issue-label: needs-info
          days-before-issue-stale: -1
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          labels-to-add-when-unstale: needs-triage
          close-issue-reason: not_planned
          close-issue-message: >
            Closing because this Issue has been inactive for 14 days while
            awaiting requested information. Thank you for the report. If you
            can provide the missing details, comment here. A maintainer will
            review them and reopen the Issue when appropriate.
